# Kiểm thử tự động (không cần secret): mỗi lần push main → npm run test:data, test:pool, npm run build, npm run test:smoke
# (1 ngoại hình cho nhanh, chạy trên bản build, mạng tắt ?net=off — không đụng máy chủ chơi nhiều người thật) + 2 test thêm:
# bản lưu cũ lệch data, vào zone 4 khi có người chơi khác (máy chủ local server/ chạy bằng wrangler dev, không cần tài khoản).
# Chạy tay (Actions → test → Run workflow): cả 3 ngoại hình. Lỗi → workflow đỏ, ảnh bước hỏng ở artifact test-results.
name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            game/package-lock.json
            server/package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Cài máy chủ chơi nhiều người local (cho test vào zone 4 khi có người chơi khác)
        run: npm --prefix ../server ci

      - name: Kiểm tra dữ liệu (test:data)
        run: npm run test:data

      - name: Vật lý bi-a (test:pool — 1.000 cú phá bi, tất định)
        run: npm run test:pool

      - name: Build
        run: npm run build

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Chơi thử tự động (test:smoke)
        run: npm run test:smoke -- --build ${{ github.event_name == 'workflow_dispatch' && '' || '--look intern_nam' }}

      - name: Ảnh bước hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
