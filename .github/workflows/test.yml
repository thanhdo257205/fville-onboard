# Kiểm thử tự động (không cần secret): mỗi lần push main và mỗi Pull Request vào main (mở, push thêm, mở lại) → npm run
# test:data, test:pool, npm run build, npm run test:smoke (1 ngoại hình cho nhanh, chạy trên bản build, mạng tắt ?net=off —
# không đụng máy chủ chơi nhiều người thật) + các test thêm: bản lưu cũ lệch data; với máy chủ local server/ (wrangler dev,
# không cần tài khoản): vào zone 4 khi có người chơi khác, bi-a 2 người (2 trình duyệt chơi trọn một ván), chia phòng.
# test:pool gồm cả luật 8 bi + bàn bi-a của máy chủ (scripts/tests/pool_rules.mjs).
# Chạy tay (Actions → test → Run workflow): cả 3 ngoại hình. Lỗi → workflow đỏ, ảnh bước hỏng ở artifact test-results.
# Pull Request từ fork: GitHub chỉ cấp quyền đọc (permissions bên dưới) — workflow không cần secret nên vẫn chạy đủ.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            game/package-lock.json
            server/package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Cài máy chủ chơi nhiều người local (test mạng: zone 4 có người chơi khác, bi-a 2 người, chia phòng)
        run: npm --prefix ../server ci

      - name: Kiểm tra dữ liệu (test:data)
        run: npm run test:data

      - name: Bi-a (test:pool — 1.000 cú phá bi, tất định; luật 8 bi, bàn máy chủ, ván 2 người giả)
        run: npm run test:pool

      - name: Build
        run: npm run build

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Chơi thử tự động (test:smoke)
        run: npm run test:smoke -- --build ${{ github.event_name == 'workflow_dispatch' && '' || '--look intern_nam' }}

      - name: Ảnh bước hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
