# Máy chủ chơi nhiều người (docs/multiplayer.md). Gói Free của Cloudflare: Durable Object phải dùng SQLite
# (new_sqlite_classes) — game KHÔNG ghi gì xuống storage, chỉ giữ trong bộ nhớ.
name = "fville-net"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "FVilleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FVilleRoom"]

[observability]
enabled = false
